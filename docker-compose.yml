services:
  postgres:
    image: postgres:16-alpine
    container_name: unomatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unomatch
      POSTGRES_PASSWORD: unomatch
      POSTGRES_DB: unomatch
    ports:
      - "5432:5432"
    volumes:
      - unomatch-postgres-data:/var/lib/postgresql/data

volumes:
  unomatch-postgres-data:
